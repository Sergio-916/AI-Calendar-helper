version: '3'

services:
  telegram-bot:
    build: .
    container_name: telegram-calendar-bot
    restart: unless-stopped
    volumes:
      - ./credentials.json:/app/credentials.json
      - ./token.pickle:/app/token.pickle
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TZ=Europe/Moscow